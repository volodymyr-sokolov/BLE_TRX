# ble_trx: nRF52840 BLE packet generator and sniffer.
#
# No SoftDevice and no Bluetooth stack: RADIO is driven directly, which is
# what makes every on-air parameter controllable -- address, PDU type, channel
# (including data channels with any access address), interval, TX power,
# deliberately broken CRCs, raw PDUs, and the frequency deviation (BLE 1M vs
# Nordic's proprietary 1M mode) used to give the "twin" transmitter a
# different modulation index -- and what lets the same image receive on any
# channel / access address as a sniffer.

CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_HEAP_MEM_POOL_SIZE=2048
CONFIG_ISR_STACK_SIZE=2048

CONFIG_GPIO=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_UART_LINE_CTRL=y

# USB CDC ACM is the command channel.
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="nRF52840 BLE TX/RX"
CONFIG_USB_DEVICE_MANUFACTURER="ble_trx"
CONFIG_USB_DEVICE_VID=0x1915
CONFIG_USB_DEVICE_PID=0x520F
CONFIG_USB_CDC_ACM=y
# Sniffer output bursts; a larger ring rides out the host's USB polling gaps.
CONFIG_USB_CDC_ACM_RINGBUF_SIZE=16384
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n

CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_PRINTK=y
CONFIG_CBPRINTF_FP_SUPPORT=n

CONFIG_ENTROPY_GENERATOR=y

# Saved configuration ("save" / "boot on") in the settings_storage partition.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

CONFIG_REBOOT=y
CONFIG_CRC=y
CONFIG_ASSERT=y
CONFIG_THREAD_NAME=y

# Link the application at 0x26000 where the Adafruit nRF52 bootloader hands
# over.  Without this Zephyr links at 0x0 and the bootloader is erased.
CONFIG_USE_DT_CODE_PARTITION=y
